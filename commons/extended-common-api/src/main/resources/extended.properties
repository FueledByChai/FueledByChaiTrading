# Extended (extended.exchange) configuration.
# Environment: "prod" (mainnet, SN_MAIN) or "testnet" (Sepolia, SN_SEPOLIA).
extended.environment=prod

# Credentials (required for private API / order placement).
# Provide via env vars (EXTENDED_API_KEY, EXTENDED_STARK_PRIVATE_KEY,
# EXTENDED_STARK_PUBLIC_KEY, EXTENDED_VAULT_ID, EXTENDED_ACCOUNT_ID) or here.
# extended.api.key=
# extended.stark.private.key=0x...
# extended.stark.public.key=0x...
# extended.vault.id=
# extended.account.id=

# Optional URL overrides (defaults target mainnet/testnet automatically).
# extended.mainnet.rest.url=https://api.starknet.extended.exchange/api/v1
# extended.mainnet.ws.url=wss://api.starknet.extended.exchange/stream.extended.exchange/v1
# extended.testnet.rest.url=https://api.starknet.sepolia.extended.exchange/api/v1
# extended.testnet.ws.url=wss://api.starknet.sepolia.extended.exchange/stream.extended.exchange/v1
